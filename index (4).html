:root {
  color-scheme: dark;
  --bg: #100f0e; --surface: #191715; --line: #3a3229;
  --cream: #f4ead8; --muted: #bfb4a6; --quiet: #b2a698; --gold: #f3b451;
  --archive: #bbccdc; --archive-bg: #263440;
  --gutter: clamp(12px, 4.6vw, 26px); --wide: 38rem;
  font: 100%/1.45 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}html{min-height:100%;background:var(--bg);scroll-padding-top:1rem}
body{margin:0;color:var(--cream);background:var(--bg);min-height:100vh}
h1,h2,h3,p,dl,dd{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;padding:0;cursor:pointer}
button,a,select{-webkit-tap-highlight-color:rgba(245,184,94,.15);touch-action:manipulation}
a{color:inherit;text-decoration:none}svg{display:block}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.definitions{display:block;width:0;height:0;position:absolute;overflow:hidden}.ico{inline-size:1.14rem;block-size:1.14rem;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
.sr,.skip:not(:focus){position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip:focus{position:fixed;z-index:10;top:.7rem;left:.7rem;background:var(--gold);color:#221a10;padding:.55rem .85rem;border-radius:.35rem}
.page{padding-bottom:calc(4.7rem + env(safe-area-inset-bottom,0px));min-height:100svh}
.wrap,.mast-inner{width:min(100%,var(--wide));margin-inline:auto;padding-inline:var(--gutter)}
.page {
  width: min(100%, var(--wide));
  margin-inline: auto;
  background: var(--bg);
}
.mast {
  padding-top: env(safe-area-inset-top, 0px);
  background: #12100e;
  border-bottom: 1px solid #33291e;
}
.mast-inner, .brand, .menu { display: flex; align-items: center; }
.mast-inner { justify-content: space-between; gap: .75rem; min-height: 3.65rem; }
.brand { gap: .68rem; }
.brand-logo { display: block; width: 3.12rem; height: 2.94rem; object-fit: contain; }
.brand-word {
  display: grid;
  gap: .16rem;
  border-left: 1px solid #483b2d;
  padding-left: .72rem;
  line-height: 1.15;
}
.brand-word strong { color: var(--cream); font-size: .91rem; font-weight: 700; }
.brand-word small { color: var(--muted); font-size: .76rem; }
.menu { min-height: 44px; gap: .44rem; padding-inline: .55rem .05rem; font-size: .91rem; font-weight: 700; }
.menu .ico { width: 1rem; height: 1rem; color: var(--gold); }
.intro {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  min-height: clamp(8.5rem, 38vw, 12rem);
  margin-inline: calc(0px - var(--gutter));
  padding: .82rem var(--gutter) .95rem;
  overflow: hidden;
  border-bottom: 1px solid #49351e;
  background: radial-gradient(ellipse at 67% 108%, #35200b 0%, transparent 59%), #090805;
}

.intro-copy { max-width: 69%; }
.eyebrow { display: flex; align-items: center; gap: .47rem; color: #e9ba76; font-size: .77rem; font-weight: 700; }
.eyebrow::before { content: ""; height: 2px; width: 1.18rem; flex: none; background: var(--gold); }
.intro h1 {
  margin: .2rem 0 .25rem -.04em;
  color: #f6e6c9;
  font: 700 clamp(3.9rem, 17.2vw, 6.25rem)/1.02 Oswald, "Arial Narrow", sans-serif;
  letter-spacing: -.045em;
  text-transform: uppercase;
}
.period {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: .04rem .4rem;
  color: #d9c5a5;
  font-size: .76rem;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}
.period strong { font-weight: 600; }
.period small { color: #bda98a; font-size: .92em; white-space: nowrap; }
.period small::before { content: "·"; margin-inline-end: .4rem; }

.toolbar,.tools,.segmented,.monthbar,.arrows,.calendar-foot,.legend,.legend>span,.agenda-heading,.venue,.venue>span,.venue>a,.contact-pair,.contact,.sheet-head,.row-status,.status-tag,.util,.criteria,.sheet-facts,.line-contact,.contact-sign,.card-meta,.dialog-kicker{display:flex;align-items:center}
.toolbar{min-width:0;justify-content:space-between;gap:.55rem;border-bottom:1px solid var(--line);padding:.7rem 0 .68rem}
.segmented{border:1px solid #59432a;border-radius:.63rem;padding:2px;background:#19150f;flex:none}
.segmented button,.tool{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.39rem;font-size:.86rem;font-weight:700}
.segmented button{border-radius:.43rem;padding:0 clamp(.54rem,2.1vw,.9rem);color:var(--muted)}
.segmented button .ico{width:1rem;height:1rem}
.segmented button[aria-pressed=true]{background:linear-gradient(140deg,#f9ce8e,#efb45b);color:#241a0c}
.tools{gap:.25rem;justify-content:flex-end}.tool{position:relative;min-width:44px;color:#d3c7b7;border-radius:.5rem;padding:.25rem .43rem}
.tool[aria-expanded=true],.tool[aria-pressed=true],.tool.has-query{background:#382a19;color:var(--gold)}
.tool[aria-pressed=true] use,.util[aria-pressed=true] .ico{fill:currentColor}
.tool-word{display:none}.fav-count{position:absolute;top:0;right:0;font:700 .64rem/1.4 Manrope,sans-serif;background:var(--gold);color:#24190c;min-width:.95rem;border-radius:20px;text-align:center}
.filter-panel{border-bottom:1px solid var(--line);padding:.85rem 0 1rem;display:grid;gap:.62rem}
.query,.select-wrap{display:flex;align-items:center;background:#211d18;border:1px solid #514233;border-radius:.52rem}
.query{padding-inline:.7rem;gap:.55rem}.query>.ico{color:var(--quiet);width:1rem}.query input{width:100%;height:44px;background:none;border:0;font-size:1rem;color:var(--cream);min-width:0;outline:0}
.query:focus-within,.select-wrap:focus-within,.month-choice:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.query input::placeholder{color:#a7a39b}.filter-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
.filter-controls label{min-width:0;font-size:.79rem;color:var(--muted);font-weight:600}

    rows.push("SUMMARY:"+icsText(item.title),"LOCATION:"+icsText(venue.name+", "+venue.city+", "+venue.address),"DESCRIPTION:"+icsText(extraInfo(item)));

    rows.push("END:VEVENT","END:VCALENDAR");return rows.map(foldLine).join("\r\n")+"\r\n";
  }
  function exportEvent(item){
    const blob=new Blob([calendarText(item)],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob);
    const link=el("a");link.href=url;link.download=item.id+".ics";detail.append(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    report(item.startTime?"Файл события готов для календаря.":"Дата сохранена в файле календаря без времени начала.");
  }
  function refreshClock(force=false){
    clearTimeout(clockTimer);
    const now=Date.now(),localDay=dateAtVenue(now);
    const key=localDay+"|"+events.map(item=>stateOf(item,now)).join(",");
    if(force||key!==clockKey){
      today=localDay;clockKey=key;render();
      if(dialog.open){const y=detail.scrollTop;applyRoute(true);detail.scrollTop=y}
    }
    if(document.hidden)return;
    let next=venueToUTC(shiftDay(localDay,1),"00:00");
    for(const t of times.values()){
      if(t.start>now)next=Math.min(next,t.start);
      if(t.end>now)next=Math.min(next,t.end);
    }
    clockTimer=setTimeout(()=>refreshClock(),Math.max(100,next-now+30));
  }
  window.addEventListener("storage",e=>{
    if(e.key!==storageKey&&e.key!==null)return;
    saved=readSaved();render();if(dialog.open)applyRoute(true);
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshClock()});
  window.addEventListener("pageshow",()=>refreshClock());
  if(events.length){
    const first=events[0].date,last=events[events.length-1].date;
    const years=first.slice(0,4)===last.slice(0,4)?first.slice(0,4):first.slice(0,4)+" — "+last.slice(0,4);
    $("period").append(el("strong","",fmt(dayMonth,first)+" — "+fmt(dayMonth,last)),el("small","",years));
  }
  refreshClock(true);applyRoute();
})();
</script>
